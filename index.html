<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    
    <script>
        (function() {
            const currentUrl = new URL(window.location.href);
            if (!currentUrl.searchParams.has('v')) {
                currentUrl.searchParams.set('v', new Date().getTime());
                window.location.replace(currentUrl.toString());
            }
        })();
    </script>
    
    <title>Spotify Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { spBlack: '#121212', spGreen: '#1ed760', spGray: '#b3b3b3', spDark: '#282828' }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .truncate-2-lines { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        body { height: 100dvh; } 
        .safe-bottom { padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
        
        input[type=range] { -webkit-appearance: none; background: #4d4d4d; border-radius: 5px; height: 4px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; transition: transform 0.1s; }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.3); }
        
        .slide-up { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .slide-up.active { transform: translateY(0); }
    </style>
</head>
<body class="bg-black text-white font-sans w-full flex justify-center overflow-hidden">

    <div class="w-full max-w-md h-full bg-spBlack relative flex flex-col">
        
        <div id="libraryView" class="flex-1 overflow-y-auto pb-48 w-full">
            <div class="px-4 py-6 sticky top-0 bg-spBlack z-10 flex justify-between items-center shadow-md">
                <div class="flex items-center space-x-4">
                    <div class="w-8 h-8 bg-pink-500 rounded-full flex items-center justify-center text-sm font-bold">B</div>
                    <h1 class="text-2xl font-bold">Your Library</h1>
                </div>
                <div class="flex space-x-4 text-xl text-spGray">
                    <i class="fas fa-search"></i>
                    <i class="fas fa-plus"></i>
                </div>
            </div>
            
            <div class="px-4 flex space-x-2 mb-4">
                <span class="bg-spDark px-4 py-1.5 rounded-full text-sm">Playlists</span>
                <span class="bg-spDark px-4 py-1.5 rounded-full text-sm">Albums</span>
            </div>

            <div class="px-4 grid grid-cols-2 gap-4" id="libraryGrid"></div>
        </div>

        <div id="albumView" class="hidden flex-1 overflow-y-auto pb-48 w-full transition-all duration-300">
            
            <div class="flex justify-between items-center px-4 py-4 sticky top-0 z-10">
                <button onclick="showLibrary()" class="text-white text-xl"><i class="fas fa-arrow-left"></i></button>
                <button class="text-white text-xl"><i class="fas fa-ellipsis-v"></i></button>
            </div>

            <div class="flex flex-col items-center mt-2 mb-6 px-4">
                <img id="headerCover" src="" class="w-60 h-60 shadow-2xl mb-4 rounded-sm object-cover">
                <div class="w-full text-left">
                    <h1 id="headerAlbumTitle" class="text-2xl font-bold mb-1">Album</h1>
                    <div class="flex items-center text-sm mb-1">
                        <span id="headerArtist" class="font-bold">Artist</span>
                    </div>
                    <p id="headerMeta" class="text-spGray text-xs">Album • Offline</p>
                </div>
            </div>

            <div class="flex justify-between items-center mb-6 px-4">
                <div class="flex space-x-4 text-spGray text-xl">
                    <button class="text-spGreen"><i class="fas fa-heart"></i></button>
                    <button class="text-spGreen"><i class="fas fa-arrow-circle-down"></i></button>
                    <button><i class="fas fa-ellipsis-h"></i></button>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-spGray text-2xl"><i class="fas fa-random"></i></button>
                    <button onclick="togglePlay()" class="w-14 h-14 bg-spGreen rounded-full flex items-center justify-center text-black text-xl hover:scale-105">
                        <i class="fas fa-play" id="mainPlayIcon"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col px-4" id="tracklist"></div>
        </div>

        <div id="fullPlayerView" class="fixed inset-0 w-full max-w-md mx-auto h-full z-[60] flex flex-col slide-up" style="background: linear-gradient(to bottom, #4a5568 0%, #121212 100%);">
            
            <div class="flex justify-between items-center px-6 py-6 mt-4">
                <button onclick="closeFullPlayer()" class="text-white text-2xl"><i class="fas fa-chevron-down"></i></button>
                <div class="flex flex-col items-center">
                    <span class="text-xs font-medium uppercase tracking-widest text-white/70">Playing from Album</span>
                    <span id="fullPlayerAlbum" class="text-sm font-bold truncate">Album Name</span>
                </div>
                <button class="text-white text-xl"><i class="fas fa-ellipsis-v"></i></button>
            </div>

            <div class="flex-1 flex items-center justify-center px-6">
                <img id="fullCover" src="" class="w-full aspect-square rounded-lg shadow-2xl object-cover">
            </div>

            <div class="px-6 pb-12 safe-bottom">
                <div class="flex justify-between items-end mb-6">
                    <div class="flex-1 overflow-hidden pr-4">
                        <h2 id="fullTitle" class="text-2xl font-bold truncate text-white mb-1">Song Title</h2>
                        <p id="fullArtist" class="text-lg text-spGray truncate">Artist</p>
                    </div>
                    <button class="text-spGreen text-2xl"><i class="fas fa-heart"></i></button>
                </div>

                <div class="mb-6 flex flex-col">
                    <input type="range" id="scrubber" class="w-full" value="0" step="0.1">
                    <div class="flex justify-between text-xs text-spGray mt-2 font-mono">
                        <span id="timeCurrent">0:00</span>
                        <span id="timeTotal">0:00</span>
                    </div>
                </div>

                <div class="flex justify-between items-center">
                    <button class="text-spGray text-2xl"><i class="fas fa-random"></i></button>
                    <button onclick="prevTrack()" class="text-white text-4xl"><i class="fas fa-step-backward"></i></button>
                    <button onclick="togglePlay(event)" class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-black text-2xl hover:scale-105 transition-transform">
                        <i class="fas fa-play" id="fullPlayIcon"></i>
                    </button>
                    <button onclick="nextTrack()" class="text-white text-4xl"><i class="fas fa-step-forward"></i></button>
                    <button class="text-spGray text-2xl"><i class="fas fa-redo"></i></button>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 w-full z-50 bg-gradient-to-t from-black via-black to-transparent pt-6">
            
            <div class="px-2">
                <div onclick="openFullPlayer()" class="bg-spDark rounded-md flex items-center p-2 shadow-lg mb-2 cursor-pointer hover:bg-gray-700 transition-colors">
                    <img id="npCover" src="https://placehold.co/100x100/121212/FFF?text=Art" class="w-10 h-10 rounded-sm mr-3 object-cover">
                    <div class="flex-1 overflow-hidden">
                        <div id="npTitle" class="text-sm font-bold truncate text-white">Not Playing</div>
                        <div id="npArtist" class="text-xs text-spGray truncate">Select a track</div>
                    </div>
                    <div class="flex items-center space-x-4 px-2 text-xl">
                        <button class="text-spGreen" onclick="event.stopPropagation()"><i class="fas fa-laptop-house text-sm"></i></button>
                        <button onclick="togglePlay(event)" class="text-white w-8 h-8 flex items-center justify-center">
                            <i class="fas fa-play" id="npPlayIcon"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-around items-center pt-2 px-2 bg-spBlack text-spGray text-xs safe-bottom shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
                <button onclick="showLibrary()" class="flex flex-col items-center hover:text-white transition-colors"><i class="fas fa-home text-xl mb-1"></i>Home</button>
                <button class="flex flex-col items-center hover:text-white transition-colors"><i class="fas fa-search text-xl mb-1"></i>Search</button>
                <button onclick="showLibrary()" class="flex flex-col items-center text-white"><i class="fas fa-book-open text-xl mb-1"></i>Library</button>
                <button class="flex flex-col items-center hover:text-white transition-colors"><i class="fab fa-spotify text-xl mb-1"></i>Premium</button>
            </div>
        </div>

    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // ==========================================
        // YOUR DATABASE
        // ==========================================
        const library = {
            "nostalgia-ultra": {
                id: "nostalgia-ultra",
                title: "Nostalgia, ULTRA",
                artist: "Frank Ocean",
                meta: "Mixtape • 2011 • 14 songs, 42 min 7 sec",
                cover: "music/nostalgia-ultra/album.webp",
                themeColor: "#d9772b", 
                tracks: [
                    { id: 0, title: "Street Fighter", file: "music/nostalgia-ultra/audio-01.mp3" },
                    { id: 1, title: "Strawberry Swing", file: "music/nostalgia-ultra/audio-02.mp3" },
                    { id: 2, title: "Novacane", file: "music/nostalgia-ultra/audio-03.mp3" },
                    { id: 3, title: "We All Try", file: "music/nostalgia-ultra/audio-04.mp3" },
                    { id: 4, title: "Bitches Talkin'", file: "music/nostalgia-ultra/audio-05.mp3" },
                    { id: 5, title: "Songs For Women", file: "music/nostalgia-ultra/audio-06.mp3" },
                    { id: 6, title: "LoveCrimes", file: "music/nostalgia-ultra/audio-07.mp3" },
                    { id: 7, title: "Goldeneye", file: "music/nostalgia-ultra/audio-08.mp3" },
                    { id: 8, title: "There Will Be Tears", file: "music/nostalgia-ultra/audio-09.mp3" },
                    { id: 9, title: "Swim Good", file: "music/nostalgia-ultra/audio-10.mp3" },
                    { id: 10, title: "Dust", file: "music/nostalgia-ultra/audio-11.mp3" },
                    { id: 11, title: "American Wedding", file: "music/nostalgia-ultra/audio-12.mp3" },
                    { id: 12, title: "Soul Calibur", file: "music/nostalgia-ultra/audio-13.mp3" },
                    { id: 13, title: "Nature Feels", file: "music/nostalgia-ultra/audio-14.mp3" }
                ]
            },
            "art-of-loving": {
                id: "art-of-loving",
                title: "The Art of Loving",
                artist: "Olivia Dean",
                meta: "Album • 2025 • 12 songs, 34 min 23 sec",
                cover: "music/the-art-of-loving/album.webp",
                themeColor: "#4a5568", 
                tracks: [
                    { id: 0, title: "The Art of Loving (Intro)", file: "music/the-art-of-loving/the-art-of-loving-(intro).mp3" },
                    { id: 1, title: "Lady Lady", file: "music/the-art-of-loving/lady-lady.mp3" },
                    { id: 2, title: "Nice To Each Other", file: "music/the-art-of-loving/nice-to-each-other.mp3" }
                ]
            }
        };

        // ==========================================
        // APP STATE & LOGIC
        // ==========================================
        let currentAlbumId = null;  
        let playingAlbumId = null;  
        let playingTrackId = null;  
        let isPlaying = false;
        let isDraggingScrubber = false; 

        const audioPlayer = document.getElementById('audioPlayer');
        const scrubber = document.getElementById('scrubber');
        
        function handleRouting() {
            const hash = window.location.hash.substring(1);
            
            if (hash === 'player') {
                document.getElementById('fullPlayerView').classList.add('active');
                return; 
            } else {
                document.getElementById('fullPlayerView').classList.remove('active');
            }

            if (hash === '') {
                document.getElementById('albumView').classList.add('hidden');
                document.getElementById('libraryView').classList.remove('hidden');
                currentAlbumId = null;
            } else if (library[hash]) {
                currentAlbumId = hash;
                const album = library[hash];
                
                document.getElementById('headerCover').src = album.cover;
                document.getElementById('headerAlbumTitle').innerText = album.title;
                document.getElementById('headerArtist').innerText = album.artist;
                document.getElementById('headerMeta').innerText = album.meta;
                document.getElementById('albumView').style.background = `linear-gradient(to bottom, ${album.themeColor} 0%, #121212 40%)`;

                renderTracklist();
                document.getElementById('libraryView').classList.add('hidden');
                document.getElementById('albumView').classList.remove('hidden');
            }
        }

        window.addEventListener('hashchange', handleRouting);
        window.addEventListener('DOMContentLoaded', handleRouting);

        function showLibrary() { window.location.hash = ''; }
        function openAlbum(albumId) { window.location.hash = albumId; }
        function openFullPlayer() { if (playingTrackId !== null) window.location.hash = 'player'; }
        function closeFullPlayer() { window.history.back(); }

        function renderLibrary() {
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = '';
            
            Object.values(library).forEach(album => {
                grid.innerHTML += `
                    <div class="flex flex-col cursor-pointer active:scale-95 transition-transform" onclick="openAlbum('${album.id}')">
                        <img src="${album.cover}" class="w-full aspect-square object-cover mb-2 shadow-lg rounded-md" onerror="this.src='https://placehold.co/400x400/282828/FFF?text=Art'">
                        <span class="text-sm font-bold truncate-2-lines text-white mt-1">${album.title}</span>
                        <span class="text-xs text-spGray truncate">${album.artist}</span>
                    </div>
                `;
            });
        }

        function renderTracklist() {
            if(!currentAlbumId) return;
            const album = library[currentAlbumId];
            const tracklistContainer = document.getElementById('tracklist');
            tracklistContainer.innerHTML = '';
            
            album.tracks.forEach(track => {
                const isCurrent = (playingAlbumId === currentAlbumId && playingTrackId === track.id);
                const textColor = isCurrent ? 'text-spGreen' : 'text-white';
                
                tracklistContainer.innerHTML += `
                    <div class="flex justify-between items-center py-3 active:bg-spDark rounded-md px-2 -mx-2 transition-colors cursor-pointer" onclick="playTrack('${album.id}', ${track.id})">
                        <div class="flex flex-col">
                            <span class="text-base ${textColor} font-medium">${track.title}</span>
                            <span class="text-sm text-spGray">${album.artist}</span>
                        </div>
                        <button class="text-spGray text-lg" onclick="event.stopPropagation()"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                `;
            });
        }

        function playTrack(albumId, trackId) {
            const album = library[albumId];
            const track = album.tracks.find(t => t.id === trackId);

            if (playingAlbumId !== albumId || playingTrackId !== trackId) {
                playingAlbumId = albumId;
                playingTrackId = trackId;
                audioPlayer.src = track.file;
                
                document.getElementById('npTitle').innerText = track.title;
                document.getElementById('npArtist').innerText = album.artist;
                document.getElementById('npCover').src = album.cover;

                document.getElementById('fullTitle').innerText = track.title;
                document.getElementById('fullArtist').innerText = album.artist;
                document.getElementById('fullCover').src = album.cover;
                document.getElementById('fullPlayerAlbum').innerText = album.title;
                document.getElementById('fullPlayerView').style.background = `linear-gradient(to bottom, ${album.themeColor} 0%, #121212 100%)`;
            }
            
            audioPlayer.play().catch(e => console.log("Audio play failed: Check file names exactly!", e));
            isPlaying = true;
            renderTracklist(); 
            updatePlayIcons();
        }

        function togglePlay(event) {
            if (event) event.stopPropagation(); 
            if (playingTrackId === null) {
                if (currentAlbumId) playTrack(currentAlbumId, 0);
                return;
            }
            if (isPlaying) { audioPlayer.pause(); isPlaying = false; } 
            else { audioPlayer.play(); isPlaying = true; }
            updatePlayIcons();
        }

        function nextTrack() {
            if(!playingAlbumId) return;
            const album = library[playingAlbumId];
            let nextId = playingTrackId + 1;
            if(nextId >= album.tracks.length) nextId = 0; 
            playTrack(playingAlbumId, nextId);
        }

        function prevTrack() {
            if(!playingAlbumId) return;
            if(audioPlayer.currentTime > 3) {
                audioPlayer.currentTime = 0;
                return;
            }
            const album = library[playingAlbumId];
            let prevId = playingTrackId - 1;
            if(prevId < 0) prevId = album.tracks.length - 1; 
            playTrack(playingAlbumId, prevId);
        }

        function updatePlayIcons() {
            const iconClass = isPlaying ? 'fa-pause' : 'fa-play';
            document.getElementById('mainPlayIcon').className = `fas ${iconClass}`;
            document.getElementById('npPlayIcon').className = `fas ${iconClass}`;
            document.getElementById('fullPlayIcon').className = `fas ${iconClass}`;
        }

        function formatTime(seconds) {
            if(isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        scrubber.addEventListener('mousedown', () => isDraggingScrubber = true);
        scrubber.addEventListener('touchstart', () => isDraggingScrubber = true, {passive: true});
        
        scrubber.addEventListener('mouseup', () => { 
            audioPlayer.currentTime = scrubber.value; 
            isDraggingScrubber = false; 
        });
        scrubber.addEventListener('touchend', () => { 
            audioPlayer.currentTime = scrubber.value; 
            isDraggingScrubber = false; 
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            scrubber.max = audioPlayer.duration;
            document.getElementById('timeTotal').innerText = formatTime(audioPlayer.duration);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            if(!isDraggingScrubber) {
                scrubber.value = audioPlayer.currentTime;
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                scrubber.style.background = `linear-gradient(to right, #1ed760 ${progress}%, #4d4d4d ${progress}%)`;
            }
            document.getElementById('timeCurrent').innerText = formatTime(audioPlayer.currentTime);
        });

        audioPlayer.onended = function() { nextTrack(); };

        // INITIAL BOOT
        renderLibrary();
    </script>
</body>
</html>
